apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "rescope.labels" . | nindent 4 }}
spec:
  selector: {{- include "rescope.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "rescope.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: {{- include "rescope.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "rescope.selector" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "rescope.podSecurity" (list 1000 1000) | nindent 6 }}
      containers:
        - name: api
          image: {{ include "rescope.image" (dict "root" . "name" "api") }}
          {{- include "rescope.containerSecurity" . | nindent 10 }}
          # Migrations run in the migrate Job, not on every pod boot as the compose image does.
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            {{- include "rescope.appEnv" . | nindent 12 }}
            - name: CORS_ORIGINS
              value: {{ printf "[\"https://%s\"]" .Values.domain | quote }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: { path: /api/v1/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-scrape-storage
        - name: tmp
          emptyDir: {}

[project]
name = "rescope-api"
version = "0.1.0"
description = "ReScope API — FastAPI backend for the multi-tenant company-intelligence CRM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
    "httpx>=0.27",
    "orjson>=3.10",
    "arq>=0.26",
    "pgvector>=0.3",
    "playwright>=1.62.0",
    "markdownify>=1.2.3",
    "beautifulsoup4>=4.15.0",
    "anthropic>=1.5.0",
    "python-multipart>=0.0.32",
    "cryptography>=50.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

# An application, not a library — nothing imports `rescope_api` as a package, so skip the build step.
[tool.uv]
package = false
# arq pins `redis<6` but only uses long-stable connection/pool APIs; the app itself targets redis 5+/8-era
# stubs, so keep one version rather than letting arq drag it down.
override-dependencies = ["redis>=8.1"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

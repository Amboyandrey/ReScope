apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "rescope.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "rescope.selector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "rescope.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "rescope.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "rescope.selector" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      {{- include "rescope.podSecurity" (list 999 999) | nindent 6 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          {{- include "rescope.containerSecurity" . | nindent 10 }}
          env:
            - name: POSTGRES_USER
              value: rescope
            - name: POSTGRES_DB
              value: rescope
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secret.name }}, key: POSTGRES_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "rescope"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "rescope"] }
            periodSeconds: 30
            failureThreshold: 5
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}

{{- if .Values.secret.sealedData }}
# Decrypted in-cluster by the sealed-secrets controller; ciphertext is bound to this name and namespace.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secret.name }}
  labels: {{- include "rescope.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  encryptedData: {{- toYaml .Values.secret.sealedData | nindent 4 }}
  template:
    metadata:
      name: {{ .Values.secret.name }}
{{- end }}

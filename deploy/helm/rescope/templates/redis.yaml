apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
  labels: {{- include "rescope.labels" . | nindent 4 }}
spec:
  selector: {{- include "rescope.selector" (dict "root" . "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-redis
  labels: {{- include "rescope.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: {{ .Release.Name }}-redis
  replicas: 1
  selector:
    matchLabels: {{- include "rescope.selector" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "rescope.selector" (dict "root" . "component" "redis") | nindent 8 }}
    spec:
      {{- include "rescope.podSecurity" (list 999 1000) | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          {{- include "rescope.containerSecurity" . | nindent 10 }}
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 30
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
        # Exposes the two arq queue lengths (sorted-set cardinality) for the backlog alert.
        - name: exporter
          image: {{ .Values.redis.exporterImage }}
          {{- include "rescope.containerSecurity" . | nindent 10 }}
          args: ["--redis.addr=redis://localhost:6379", "--check-keys=scrape_queue,arq:queue"]
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}

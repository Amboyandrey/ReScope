apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "rescope.labels" . | nindent 4 }}
spec:
  selector: {{- include "rescope.selector" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "rescope.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: {{- include "rescope.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "rescope.selector" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "rescope.podSecurity" (list 100 101) | nindent 6 }}
      containers:
        - name: web
          image: {{ include "rescope.image" (dict "root" . "name" "web") }}
          {{- include "rescope.containerSecurity" . | nindent 10 }}
          env:
            - name: API_INTERNAL_URL
              value: http://{{ .Release.Name }}-api:8000
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}

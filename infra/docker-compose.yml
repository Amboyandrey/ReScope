name: rescope

# Host ports are offset (5433, 16380) so this stack can run next to another local project that
# already holds 5432 / 6379 / 16379. Inside the compose network the services use their defaults.

services:
  postgres:
    # pgvector's image, built FROM postgres:16. The `vector` extension is created by a migration,
    # not here — every schema change is owned by Alembic.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rescope
      POSTGRES_PASSWORD: rescope
      POSTGRES_DB: rescope
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescope"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Self-hosted embeddings — Qwen3-Embedding-0.6B, 1024 dimensions, fixed in the schema (see
  # docs/PLAN.md §1 and the embeddings migration). `--auto-truncate` and a `--max-batch-tokens`
  # far below the model's own 32768-token window are load-bearing, not tuning: at the default,
  # this model's warmup batch allocates enough memory to get OOM-killed on a modest dev machine
  # before the server ever comes up — found by actually running it, not by reading the flag docs.
  # The backend also caps concurrent requests at 4 regardless of `--max-client-batch-size`.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: ["--model-id", "Qwen/Qwen3-Embedding-0.6B", "--auto-truncate", "--max-batch-tokens", "2048"]
    volumes:
      - tei_data:/data
    ports:
      - "18080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  api:
    build:
      context: ../apps/api
      dockerfile: ../../infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://rescope:rescope@postgres:5432/rescope
      # The RLS-restricted role the API serves requests as (created by the RLS migration).
      # Dev-only password.
      APP_DATABASE_URL: postgresql+asyncpg://rescope_app:rescope_app_dev_only@postgres:5432/rescope
      REDIS_URL: redis://redis:6379/0
      ROOT_DOMAIN: rescope.localhost
      CORS_ORIGINS: '["http://rescope.localhost:3000"]'
      DEBUG: "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BROWSER_USE_API_KEY: ${BROWSER_USE_API_KEY:-}
      # Dev-only — wraps every workspace-registered credential's own data key (app/core/crypto.py).
      # Rotate for any real deploy; see infra/.env.example.
      MASTER_KEY: ${MASTER_KEY:-eJ6vFr/16yVNzCb3BrN0S/fl8VdmJIr7caeqnGoCitQ=}
      EMBEDDINGS_URL: http://embeddings:80
    volumes:
      # Shared with `scraper` below: it writes Tier 2's screenshots here, the API reads them back
      # to serve one on request — the same bind-mounted-volume pattern ReCore uses for chat
      # attachments, one writer and one reader on the same files rather than a network store.
      - scrape_storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../apps/api
      dockerfile: ../../infra/Dockerfile.api
    command: ["arq", "app.workers.main.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+asyncpg://rescope:rescope@postgres:5432/rescope
      APP_DATABASE_URL: postgresql+asyncpg://rescope_app:rescope_app_dev_only@postgres:5432/rescope
      REDIS_URL: redis://redis:6379/0
      ROOT_DOMAIN: rescope.localhost
      DEBUG: "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDINGS_URL: http://embeddings:80
    depends_on:
      api:
        condition: service_started

  # Runs Tier 0 discovery and Tier 1 render + extraction (Chromium included) on its own queue —
  # see app/services/jobs.py for why it never shares work with `worker` above. Heaviest image in
  # the stack by far (Chromium plus its system libraries); expect the first build to take a while.
  scraper:
    build:
      context: ../apps/api
      dockerfile: ../../infra/Dockerfile.scraper
    environment:
      DATABASE_URL: postgresql+asyncpg://rescope:rescope@postgres:5432/rescope
      APP_DATABASE_URL: postgresql+asyncpg://rescope_app:rescope_app_dev_only@postgres:5432/rescope
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BROWSER_USE_API_KEY: ${BROWSER_USE_API_KEY:-}
      MASTER_KEY: ${MASTER_KEY:-eJ6vFr/16yVNzCb3BrN0S/fl8VdmJIr7caeqnGoCitQ=}
      EMBEDDINGS_URL: http://embeddings:80
    volumes:
      - scrape_storage:/app/storage
    depends_on:
      api:
        condition: service_started
      embeddings:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: ../../infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://api.rescope.localhost:8000
        NEXT_PUBLIC_ROOT_DOMAIN: rescope.localhost
        NEXT_PUBLIC_ROOT_URL: http://rescope.localhost:3000
    environment:
      # Server-side only (no NEXT_PUBLIC_ prefix): the container-network address the Next.js
      # server itself uses for its own SSR fetches, e.g. the tenant membership check in
      # app/t/[slug]/layout.tsx — the browser-facing NEXT_PUBLIC_API_URL above doesn't resolve
      # from inside this container, only from the host/browser.
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  tei_data:
  scrape_storage:
